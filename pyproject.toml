[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyATP"
version = "0.1.0"
description = "Python library for reading and manipulating ATP/EMTP input cards"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Bruno Oliveira", email = "bruno.sowk@gmail.com" }
]
license = { text = "MIT" }
keywords = ["ATP", "EMTP", "power-systems", "transients", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/bruno-so25/PythonATP"
Repository = "https://github.com/bruno-so25/PythonATP"
Issues = "https://github.com/bruno-so25/PythonATP/issues"

[tool.setuptools]
packages = ["pyATP", "pyATP.objects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
